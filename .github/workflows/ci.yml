name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Generated-file guard
        run: uv run okf-showcase tables --check && uv run okf-showcase index --check

      - name: Validate, compile bundles, Dataplex plan, graph
        run: uv run okf-showcase validate && uv run okf-showcase bundles && uv run okf-showcase dataplex && uv run okf-showcase graph

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
